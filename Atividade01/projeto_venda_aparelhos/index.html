<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra de aparelhos - Login</title>
</head>
<body>

    <h1> Compra de aparelhos </h1>
    <h2>Login</h2>

    <form action="sistema.html">
        <fieldset>
            <legend>Acesso ao sistema</legend>

            <p>
                <label for="idemail">E-mail:</label><br>
                <input
                    type="email"
                    name="email"
                    id="idemail"
                    placeholder="Digite seu e-mail"
                    required
                >
            </p>

            <p>
                <label for="idsenha">Senha:</label><br>
                <input
                    type="password"
                    name="senha"
                    id="idsenha"
                    placeholder="Digite sua senha"
                    required
                >
            </p>

            <input type="submit" value="Entrar">
            <input type="reset" value="Limpar">
        </fieldset>
    </form>

    <hr>

    <h3>Primeiro acesso?</h3>
    <p>
        <a href="cadastro.html">Cadastrar novo usuário</a>
    </p>

</body>
</html>
